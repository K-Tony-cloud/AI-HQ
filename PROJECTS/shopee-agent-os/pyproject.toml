[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shopee-agent-os"
version = "0.1.0"
description = "Shopee Product Intelligence Engine — analyze Affiliate Datafeed at GB scale"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "pyarrow>=16.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "discord.py>=2.3.0",
    "python-dotenv>=1.0.0",
    "apscheduler>=3.10,<4",
]

[project.scripts]
shopee           = "shopee_engine.cli:app"
shopee-discord   = "discord_bot.__main__:run"
shopee-scheduler = "scheduler.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["shopee_engine", "discord_bot", "scheduler"]
